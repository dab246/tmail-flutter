<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts an Android WebView falls back to. Emails asking for Arial, Helvetica
  or Times get Roboto / Noto there, so the desktop look-alikes are hidden.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/liberation/*</glob>
      <glob>/usr/share/fonts/truetype/freefont/*</glob>
      <glob>/usr/share/fonts/truetype/wqy/*</glob>
    </rejectfont>
  </selectfont>
  <alias binding="same"><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Noto Mono</family></prefer></alias>
</fontconfig>
