<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts a WKWebView falls back to: Helvetica, Times and Courier. They cannot
  ship here; Liberation fonts are metric-compatible with Arial, Times New
  Roman and Courier New, whose metrics match them, so line breaks stay close.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/freefont/*</glob>
      <glob>/usr/share/fonts/truetype/wqy/*</glob>
      <glob>/usr/share/fonts/truetype/roboto/*</glob>
    </rejectfont>
  </selectfont>
  <alias binding="same"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
</fontconfig>
